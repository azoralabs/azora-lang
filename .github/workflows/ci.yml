name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Compiler, AZLS and native qualification
    runs-on: ubuntu-latest
    env:
      AZORA_REQUIRE_NATIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native execution tools
        run: sudo apt-get update && sudo apt-get install -y llvm clang wabt
      - name: Full compiler and AZLS regression suites
        run: ./gradlew :compiler:desktopTest :azls:test :app:installDist :azls:fatJar --console=plain
      - name: Strict standard library tests through the real CLI
        run: ./app/build/install/azora/bin/azora test std --strict
      - name: Real CLI target integrity and native cleanup
        run: python3 tools/check-foundation.py --native
      - name: Preserve qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-test-reports
          path: |
            compiler/build/reports/tests/desktopTest
            azls/build/reports/tests/test

  platform:
    name: ${{ matrix.os }} frontend and AZLS
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full compiler and AZLS suites
        run: ./gradlew :compiler:desktopTest :azls:test --console=plain
